<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zurain Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <!-- CONFLICT ZONE: both developers will edit the line below -->
    <h1>Taha's Calculator</h1>
    <h1>Zurain Calculator</h1>

    <label for="bill">Bill amount</label>
    <input id="bill" type="number" min="0" placeholder="0.00" />

    <label for="tip">Tip percentage</label>
    <input id="tip" type="number" min="0" placeholder="15" value="15" />

    <label for="people">Number of people</label>
    <input id="people" type="number" min="1" placeholder="1" value="1" />

    <!-- CONFLICT ZONE: both developers will edit the button label below -->
    <button id="calcBtn">Calculate Student-A</button>
    <button id="calcBtn">Calculate Student-B</button>

    <div id="result" class="result"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
